name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check committed whitespace
        run: git show --check --format= HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade "pip>=26.2.1" "setuptools>=84.0.0"
          python -m pip install -e ".[dev]"

      - name: Audit backend dependencies
        run: |
          python -m pip check
          python -m pip_audit

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Test backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Lint backend
        run: python -m ruff check .

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test safe frontend rendering
        working-directory: frontend
        run: npm test

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install in project virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade "pip>=26.2.1" "setuptools>=84.0.0"
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          .\.venv\Scripts\python.exe -m pip check
          .\.venv\Scripts\python.exe -m pip_audit

      - name: Test CLI output on the Windows console
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe -m pytest
          tests\test_cli_encoding.py -q -p no:cacheprovider

      - name: Run one demo query through the CLI
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe vc.py --demo "Monolith or microservices for a three-person project?"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
