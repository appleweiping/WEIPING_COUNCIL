[project]
name = "weiping-council"
version = "2.4.1"
description = "Weiping Council multi-LLM deliberation system with 6 protocols: council, debate, red-team, consensus, specialist, tournament"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.2",
]

[project.scripts]
vc = "vc:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx2>=2.12,<3",
    "pip-audit>=2.10.1",
]

[tool.setuptools]
py-modules = ["vc"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults from the historical E4/E7/E9/F
# baseline. Keep the project's established policy explicit and reproducible.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
